name: CI Full Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Upgrade pip dan install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run tests dengan coverage
      - name: Run tests with coverage
        run: |
          python -m pytest --cov=backend --cov-report=term-missing -v

      # 5️⃣ Lint code dengan flake8
      - name: Lint with flake8
        run: |
          flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
