name: CI Full Pipeline (Backend + FE Web + FE Mobile)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  backend:
    name: Backend API (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Backend tests + coverage
        run: python -m pytest --cov=backend --cov-report=term-missing -v
      - name: Lint Backend
        run: flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend_web:
    name: Frontend Web (React.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Web dependencies
        run: |
          cd frontend-web
          npm ci
      - name: Lint Web
        run: |
          cd frontend-web
          npm run lint
      - name: Run Web tests + coverage
        run: |
          cd frontend-web
          npm run test

  frontend_mobile:
    name: Frontend Mobile (React Native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Mobile dependencies
        run: |
          cd frontend-mobile
          npm ci
      - name: Lint Mobile
        run: |
          cd frontend-mobile
          npm run lint
      - name: Run Mobile tests + coverage
        run: |
          cd frontend-mobile
          npm run test
