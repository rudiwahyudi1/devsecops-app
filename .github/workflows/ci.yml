name: CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  # ===============================
  # FRONTEND WEB (ReactJS)
  # ===============================
  frontend-web:
    name: FE Web - ReactJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # ===============================
  # FRONTEND MOBILE (React Native)
  # ===============================
  frontend-mobile:
    name: FE Mobile - React Native
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # ===============================
  # BACKEND API (Python)
  # ===============================
  backend-api:
    name: Backend API - Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  # ===============================
  # SECURITY SCAN
  # ===============================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend-web, frontend-mobile, backend-api]

    steps:
      - uses: actions/checkout@v4

      - name: Run CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v3
